<svg xmlns='http://www.w3.org/2000/svg' width='340' height='160' viewBox='0 0 340 160'>
  <defs>
    <filter id='stamp-effect' x='-5%' y='-5%' width='110%' height='110%'>
      <feTurbulence type='fractalNoise' baseFrequency='0.03' numOctaves='2' result='noise' />
      <feDisplacementMap in='SourceGraphic' in2='noise' scale='1.2' xChannelSelector='R' yChannelSelector='G' />
    </filter>
  </defs>

  <!-- Rubber Stamp Outer Box -->
  <g filter='url(#stamp-effect)' opacity='0.9'>
    <rect x='6' y='6' width='328' height='148' rx='10' ry='10' fill='none' stroke='#2b3990' stroke-width='3.5' />
    <rect x='11' y='11' width='318' height='138' rx='6' ry='6' fill='none' stroke='#2b3990' stroke-width='1.2' stroke-dasharray='12,2,4,2' />
    
    <!-- Top Headers -->
    <text x='150' y='38' font-family='Arial, Helvetica, sans-serif' font-weight='900' font-size='22' fill='#2b3990' text-anchor='middle'>For Tharani cabs</text>
    <text x='150' y='58' font-family='Arial, Helvetica, sans-serif' font-weight='800' font-size='11' fill='#2b3990' text-anchor='middle' letter-spacing='1.5'>FOR THARANI CABS</text>
    
    <!-- Signature Line & Text -->
    <line x1='30' y1='108' x2='235' y2='108' stroke='#2b3990' stroke-width='1.8' stroke-dasharray='4,2' />
    <text x='132' y='126' font-family='Arial, Helvetica, sans-serif' font-weight='700' font-size='10.5' fill='#2b3990' text-anchor='middle' letter-spacing='0.5'>Authorised Signatory</text>

    <!-- Vertical Proprietor Text on Right -->
    <g transform='translate(286, 75) rotate(-90)'>
      <text x='0' y='0' font-family='Arial, Helvetica, sans-serif' font-weight='900' font-size='16' fill='#2b3990' text-anchor='middle' letter-spacing='1'>Proprietor</text>
    </g>
  </g>

  <!-- REAL HANDWRITTEN SIGNATURE (A. Dharani) extracted from photo -->
  <image href='' x='30' y='42' width='210' height='75' preserveAspectRatio='xMidYMid meet' />
</svg>